# $schema = "https://json.schemastore.org/pyproject.json"
[project]
name = "admin-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "aio-pika>=9.6.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "psycopg>=3.3.3",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.48",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.42.0",
    "websockets>=16.0",
    "aiokafka>=0.9.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
    "uncompyle6>=3.9.3",
]
test = [
    "anyio>=4.12.1",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
addopts = ["-v", "--tb=long"]
markers = [
    "isolation: runs only in TEST_MODE=isolation",
    "integration: runs only in TEST_MODE=integration",
    "requires_rabbit: depends on RabbitMQ",
    "requires_ws: depends on websocket runtime",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
]
ignore = [
    "B008", # do not perform function calls in default args (FastAPI depends on this)
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
root = ["."]

[tool.mypy]
explicit_package_bases = true
